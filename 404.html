<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>PiRC Gateway Redirecting...</title>
    <script type="text/javascript">
        // Segment routing parameters to bypass GitHub Pages 404 isolation
        var l = window.location;
        l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + l.pathname.split('/').slice(0, 2).join('/') + '/?p=' + l.pathname.slice(1).split('/').slice(1).join('/').replace(/&/g, '~and~') + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') + l.hash);
    </script>
</head>
<body>
    <p>Navigating Sovereign Architecture Node... Syncing Decentralized Telemetry.</p>
</body>
</html>
