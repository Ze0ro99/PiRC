name: Pi Testnet1 Read-only Acceptance and Economic Rehearsal

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/testnet1_acceptance.py"
      - "tests/test_testnet1_acceptance.py"
      - "docs/TESTNET1_REALITY_SIMULATION_AND_ACCEPTANCE.md"
      - ".github/workflows/testnet1-acceptance.yml"
  workflow_dispatch:
    inputs:
      live_read_only:
        description: "Also probe live Pi Testnet Horizon and Soroban RPC (read-only; no signing or writes)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pirc-testnet1-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run deterministic end-to-end rehearsal
        run: |
          python scripts/testnet1_acceptance.py --output artifacts/testnet1-acceptance-report.json
          python -m unittest tests.test_testnet1_acceptance -v
      - name: Upload rehearsal evidence
        uses: actions/upload-artifact@v7
        with:
          name: pirc-testnet1-rehearsal
          path: artifacts/testnet1-acceptance-report.json
          if-no-files-found: error
          retention-days: 14

  live-read-only-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.live_read_only == true
    needs: deterministic-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify Pi Testnet network identity and RPC health (read-only)
        run: python scripts/testnet1_acceptance.py --live-read-only --output artifacts/testnet1-live-read-only-report.json
      - name: Upload live probe evidence
        uses: actions/upload-artifact@v7
        with:
          name: pirc-testnet1-live-read-only
          path: artifacts/testnet1-live-read-only-report.json
          if-no-files-found: error
          retention-days: 14
