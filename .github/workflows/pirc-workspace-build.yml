name: PiRC Workspace Build

on:
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "artifacts/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".npmrc"
  push:
    branches: [main, integration/sovereign-hybrid-ecosystem]
    paths:
      - "api/**"
      - "artifacts/**"
      - "lib/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig*.json"
      - "vite.config.*"
      - ".npmrc"
      - ".github/workflows/pirc-workspace-build.yml"

permissions:
  contents: read

concurrency:
  group: pirc-workspace-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-build:
    name: Typecheck and build workspace
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate
          pnpm --version
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck workspace
        run: pnpm run typecheck
      - name: Build workspace
        run: pnpm run build
