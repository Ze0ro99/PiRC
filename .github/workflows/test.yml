name: PiRC Test Suite

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.1

      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: pytest
