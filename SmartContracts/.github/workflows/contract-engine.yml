name: SmartContracts Engine (PR & Sync)

on:
  schedule:
    - cron: '0 */6 * * *'
  pull_request:
    types: [labeled]
  workflow_dispatch:

jobs:
  sync_upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sync from PiRC
        run: |
          git config user.name "Ze0ro99"
          git config user.email "ze0ro99@users.noreply.github.com"
          git remote add pirc https://github.com/Ze0ro99/PiRC.git || true
          git fetch pirc
          git merge pirc/main --allow-unrelated-histories --no-edit || echo "Sync complete"
          git push origin HEAD

  auto_merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'auto-merge')
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'merge'
            });
